name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project (with dev + http + telemetry extras)
        run: uv pip install --system -e ".[dev,http,telemetry]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml
