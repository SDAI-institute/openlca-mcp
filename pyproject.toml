[project]
name = "openlca-mcp"
version = "0.6.0"
description = "MCP server for automating Life Cycle Assessment with openLCA"
authors = [{name = "Ernest Boakye Danquah", email = "dernestbanksch@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "mcp==2.2.0",
    "fastmcp==4.0.3",
    "fastmcp-tasks==4.0.3",
    "openlca-ipc @ https://github.com/SDAI-institute/openlca-ipc/archive/2c19661ddd9c2b2cdd96cd510c8467f84b130d8d.zip",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/SDAI-institute/openlca-mcp"
Repository = "https://github.com/SDAI-institute/openlca-mcp"
Issues = "https://github.com/SDAI-institute/openlca-mcp/issues"

[project.scripts]
openlca-mcp = "src.app:run"

[project.optional-dependencies]
http = [
    "uvicorn>=0.23.0",
    "starlette>=0.27.0",
]
telemetry = [
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "posthog>=3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Pin the distributed package explicitly. Without this, setuptools' flat-layout
# auto-discovery sees both `src` and `tests` as top-level packages and aborts
# the build ("Multiple top-level packages discovered"), which breaks
# `pip install .`, wheel builds, and the `openlca-mcp` console script.
[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
